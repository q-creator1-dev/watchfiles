name: publication wake

on:
  push:
    branches: [publication-v1.3.0]
  pull_request:
    branches: [publication-v1.3.0]

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preserve selected upstream runtime and license
        run: git diff --exit-code e74b8fc7d8d9e35c3b6bb88af0aef5ea82ee815e HEAD -- src watchfiles Cargo.toml Cargo.lock pyproject.toml LICENSE
      - name: Install selected Windows dependency artifacts
        if: runner.os == 'Windows'
        run: python -m pip install --only-binary=:all: --require-hashes -r publication-adapter/requirements-windows-py312.lock
      - name: Install pinned cross-platform API for compatibility fixtures
        if: runner.os != 'Windows'
        run: python -m pip install --only-binary=:all: watchfiles==1.3.0
      - name: Qualify adapter with actual filesystem backend
        working-directory: publication-adapter
        run: python -B -m unittest -v test_publication_wake
